<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021422"/>
      <stop offset="50%" stop-color="#06233a"/>
      <stop offset="100%" stop-color="#010c14"/>
    </linearGradient>
    <linearGradient id="teal-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cp-bg)"/>

  <!-- Career Roadmap Branching Graph -->
  <g stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" fill="none">
    <path d="M 150 220 L 280 220 L 380 150 L 520 150 L 650 200"/>
    <path d="M 280 220 L 380 270 L 520 270 L 650 200"/>
  </g>

  <!-- Nodes -->
  <g>
    <!-- Foundation Node -->
    <circle cx="150" cy="220" r="16" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
    <text x="150" y="225" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
    <text x="150" y="255" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="bold">Basics</text>

    <!-- Branch A: Backend / Systems -->
    <circle cx="380" cy="150" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <text x="380" y="155" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">2A</text>
    <text x="380" y="125" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="bold">Backend &amp; DB</text>

    <!-- Branch B: 3D & AI -->
    <circle cx="380" cy="270" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <text x="380" y="275" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">2B</text>
    <text x="380" y="305" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="bold">3D &amp; Robotics</text>

    <!-- Mastery Node -->
    <circle cx="650" cy="200" r="22" fill="#0369a1" stroke="#2dd4bf" stroke-width="4"/>
    <text x="650" y="206" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">🚀</text>
    <text x="650" y="240" text-anchor="middle" fill="#2dd4bf" font-family="sans-serif" font-size="12" font-weight="bold">Mastery</text>
  </g>

  <!-- Title Badge Frame -->
  <rect x="200" y="310" width="400" height="60" rx="12" fill="#041a2e" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="338" text-anchor="middle" fill="url(#teal-blue)" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="2">CAREER PATH NAVIGATOR</text>
  <text x="400" y="358" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="11">INTERACTIVE TECH ROADMAPS &amp; MILESTONE GUIDANCE</text>

  <!-- Bottom Details Bar -->
  <rect x="160" y="395" width="480" height="42" rx="21" fill="#05243f" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="400" y="421" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">🧭 LIVE DEMO • CAREER ROADMAP &amp; SKILL ARCHITECTURE</text>
  <text x="400" y="460" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">React • TypeScript • Vercel • Comprehensive Learning Guidance</text>
</svg>