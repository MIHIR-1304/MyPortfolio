<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d29"/>
      <stop offset="50%" stop-color="#1e144a"/>
      <stop offset="100%" stop-color="#0a0718"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Radar / Real-Time Pulse -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="14" fill="#a855f7"/>

    <!-- Pulse sweep line -->
    <line x1="0" y1="0" x2="85" y2="-85" stroke="#ec4899" stroke-width="2.5"/>

    <!-- Signal nodes -->
    <circle cx="60" cy="-30" r="6" fill="#38bdf8"/>
    <circle cx="-50" cy="60" r="6" fill="#34d399"/>
    <circle cx="-70" cy="-40" r="6" fill="#f59e0b"/>
  </g>

  <rect x="220" y="300" width="360" height="40" rx="8" fill="#181135" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="325" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12">ws://telemetry.io [Socket.io • 0.2ms Latency • Redis]</text>

  <rect x="180" y="380" width="440" height="40" rx="20" fill="#1e144a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#d8b4fe" font-family="sans-serif" font-size="16" font-weight="bold">📡 REAL-TIME WEBSOCKET NOTIFICATION HUB</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Node.js • WebSockets • Redis Pub/Sub • Bidirectional Stream</text>
</svg>
