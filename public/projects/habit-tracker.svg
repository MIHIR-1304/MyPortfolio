<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ht-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727"/>
      <stop offset="50%" stop-color="#240c45"/>
      <stop offset="100%" stop-color="#0e041d"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ht-bg)"/>

  <!-- Productivity Streak Graphic -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ec4899" stroke-opacity="0.2" stroke-width="8"/>
    <!-- Progress Arc -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#purple-pink)" stroke-width="8" stroke-dasharray="320 410" stroke-linecap="round" transform="rotate(-90)"/>
    <text y="-8" fill="#f43f5e" font-size="28">🔥</text>
    <text y="24" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">30 DAYS</text>
    <text y="40" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">ACTIVE STREAK</text>
  </g>

  <!-- Habit Grid Representation -->
  <g transform="translate(250, 245)">
    <!-- Week 1 -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#ec4899"/>
    <text x="18" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
    <rect x="50" y="0" width="36" height="36" rx="8" fill="#ec4899"/>
    <text x="68" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
    <rect x="100" y="0" width="36" height="36" rx="8" fill="#ec4899"/>
    <text x="118" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
    <rect x="150" y="0" width="36" height="36" rx="8" fill="#8b5cf6"/>
    <text x="168" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
    <rect x="200" y="0" width="36" height="36" rx="8" fill="#8b5cf6"/>
    <text x="218" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
    <rect x="250" y="0" width="36" height="36" rx="8" fill="#8b5cf6"/>
    <text x="268" y="23" text-anchor="middle" fill="#fff" font-size="14 font-weight='bold'">✓</text>
  </g>

  <!-- Title Badge Frame -->
  <rect x="200" y="310" width="400" height="60" rx="12" fill="#1b0836" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="338" text-anchor="middle" fill="url(#purple-pink)" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="2">HABIT TRACKER APP</text>
  <text x="400" y="358" text-anchor="middle" fill="#f0abfc" font-family="sans-serif" font-size="11">ROUTINE ANALYTICS &amp; PRODUCTIVITY STREAKS</text>

  <!-- Bottom Details Bar -->
  <rect x="160" y="395" width="480" height="42" rx="21" fill="#200a40" stroke="#ec4899" stroke-width="1.5"/>
  <text x="400" y="421" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="14" font-weight="bold">⚡ INTERACTIVE ROUTINE &amp; CONSISTENCY MONITOR</text>
  <text x="400" y="460" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">JavaScript • React • Streak Tracking • Local Storage Persistence</text>
</svg>