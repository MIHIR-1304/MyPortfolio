<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022013"/>
      <stop offset="50%" stop-color="#052e1c"/>
      <stop offset="100%" stop-color="#01140b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- API Endpoints Gateway / Terminal Graphic -->
  <rect x="160" y="80" width="480" height="260" rx="14" fill="#061c12" stroke="#10b981" stroke-width="2"/>
  <rect x="160" y="80" width="480" height="38" rx="14" fill="#093824"/>
  <circle cx="190" cy="99" r="6" fill="#ef4444"/>
  <circle cx="210" cy="99" r="6" fill="#f59e0b"/>
  <circle cx="230" cy="99" r="6" fill="#10b981"/>
  <text x="400" y="104" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="bold">api.gateway.v1 [Express.js / Node.js]</text>

  <!-- Route Tags -->
  <g transform="translate(190, 140)">
    <rect x="0" y="0" width="55" height="26" rx="5" fill="#10b981"/>
    <text x="27" y="18" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">GET</text>
    <text x="70" y="18" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/auth/session</text>
    <text x="360" y="18" fill="#10b981" font-family="monospace" font-size="12">[200 OK]</text>

    <rect x="0" y="45" width="55" height="26" rx="5" fill="#3b82f6"/>
    <text x="27" y="63" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">POST</text>
    <text x="70" y="63" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/telemetry/stream</text>
    <text x="360" y="63" fill="#3b82f6" font-family="monospace" font-size="12">[201 CREATED]</text>

    <rect x="0" y="90" width="55" height="26" rx="5" fill="#f59e0b"/>
    <text x="27" y="108" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">PUT</text>
    <text x="70" y="108" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/users/permissions</text>
    <text x="360" y="108" fill="#f59e0b" font-family="monospace" font-size="12">[JWT RBAC]</text>

    <rect x="0" y="135" width="55" height="26" rx="5" fill="#ef4444"/>
    <text x="27" y="153" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">DEL</text>
    <text x="70" y="153" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/cache/flush</text>
    <text x="360" y="153" fill="#94a3b8" font-family="monospace" font-size="12">[RATE: 100/min]</text>
  </g>

  <rect x="180" y="380" width="440" height="40" rx="20" fill="#062e1c" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="16" font-weight="bold">⚙️ SCALABLE RESTFUL MICROSERVICES ENGINE</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Node.js • Express.js • JWT Auth • RBAC • Swagger OpenAPI</text>
</svg>
