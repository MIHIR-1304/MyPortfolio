<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="boxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Isometric Warehouse / Inventory Boxes -->
  <g transform="translate(400, 180)">
    <!-- Box 1 Center -->
    <path d="M 0 -50 L 70 -15 L 0 20 L -70 -15 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M -70 -15 L 0 20 L 0 90 L -70 55 Z" fill="#0284c7" opacity="0.9"/>
    <path d="M 70 -15 L 0 20 L 0 90 L 70 55 Z" fill="#0369a1" opacity="0.9"/>

    <!-- Box 2 Left -->
    <g transform="translate(-130, 40)">
      <path d="M 0 -40 L 55 -12 L 0 16 L -55 -12 Z" fill="#818cf8" opacity="0.85"/>
      <path d="M -55 -12 L 0 16 L 0 70 L -55 42 Z" fill="#6366f1" opacity="0.9"/>
      <path d="M 55 -12 L 0 16 L 0 70 L 55 42 Z" fill="#4f46e5" opacity="0.9"/>
    </g>

    <!-- Box 3 Right -->
    <g transform="translate(130, 40)">
      <path d="M 0 -40 L 55 -12 L 0 16 L -55 -12 Z" fill="#34d399" opacity="0.85"/>
      <path d="M -55 -12 L 0 16 L 0 70 L -55 42 Z" fill="#059669" opacity="0.9"/>
      <path d="M 55 -12 L 0 16 L 0 70 L 55 42 Z" fill="#047857" opacity="0.9"/>
    </g>
  </g>

  <!-- Barcode & Tracking Tag -->
  <rect x="250" y="300" width="300" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270" y="325" fill="#38bdf8" font-family="monospace" font-size="13">BARCODE: |||||| | |||| ||| ||</text>
  <text x="470" y="325" fill="#34d399" font-family="monospace" font-size="13">[STOCK: IN_SYNC]</text>

  <rect x="180" y="380" width="440" height="40" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="16" font-weight="bold">📦 ENTERPRISE INVENTORY &amp; SUPPLY CONTROLLER</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Java MVC • Hibernate • Automated Invoicing • Stock Trigger</text>
</svg>
