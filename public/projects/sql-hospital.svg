<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041324"/>
      <stop offset="50%" stop-color="#08223d"/>
      <stop offset="100%" stop-color="#020a14"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Database Cylinder Stacks -->
  <g transform="translate(400, 150)">
    <!-- Top Cylinder -->
    <ellipse cx="0" cy="-60" rx="90" ry="24" fill="#0891b2"/>
    <path d="M -90 -60 L -90 -10 A 90 24 0 0 0 90 -10 L 90 -60 Z" fill="#0e7490"/>
    <ellipse cx="0" cy="-10" rx="90" ry="24" fill="#06b6d4"/>

    <!-- Middle Cylinder -->
    <path d="M -90 -5 L -90 45 A 90 24 0 0 0 90 45 L 90 -5 Z" fill="#0284c7"/>
    <ellipse cx="0" cy="45" rx="90" ry="24" fill="#38bdf8"/>

    <!-- Bottom Cylinder -->
    <path d="M -90 50 L -90 100 A 90 24 0 0 0 90 100 L 90 50 Z" fill="#1d4ed8"/>
    <ellipse cx="0" cy="100" rx="90" ry="24" fill="#60a5fa"/>

    <!-- Hospital Cross Glow on Database -->
    <path d="M -10 10 L 10 10 L 10 -10 L 25 -10 L 25 10 L 45 10 L 45 25 L 25 25 L 25 45 L 10 45 L 10 25 L -10 25 Z" fill="#ffffff" opacity="0.9" transform="translate(-17, -8)"/>
  </g>

  <!-- Query Code Overlay -->
  <rect x="140" y="270" width="520" height="70" rx="10" fill="#08182b" stroke="#0891b2" stroke-width="1.5"/>
  <text x="160" y="295" fill="#38bdf8" font-family="monospace" font-size="12">SELECT p.name, d.diagnosis, r.bed_no FROM Patients p</text>
  <text x="160" y="318" fill="#a5f3fc" font-family="monospace" font-size="12">JOIN Records r ON p.id = r.patient_id WHERE r.status = 'ACTIVE';</text>

  <rect x="180" y="380" width="440" height="40" rx="20" fill="#08223d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="16" font-weight="bold">🗄️ COMPREHENSIVE HOSPITAL DBMS &amp; SCHEMA</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">MySQL • 3NF Normalization • Stored Procedures • Triggers</text>
</svg>
