<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="50%" stop-color="#0b0326"/>
      <stop offset="100%" stop-color="#02000a"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="planet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7042F8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2A0E61" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wow-bg)"/>

  <!-- Celestial Glow & Orbit Rings -->
  <circle cx="400" cy="200" r="180" fill="url(#planet-glow)"/>
  <ellipse cx="400" cy="200" rx="260" ry="80" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-15 400 200)"/>
  <ellipse cx="400" cy="200" rx="300" ry="110" fill="none" stroke="#c084fc" stroke-opacity="0.2" stroke-width="1" transform="rotate(-15 400 200)"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="260" cy="60" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="680" cy="90" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="710" cy="280" r="1.5" fill="#c084fc" opacity="0.9"/>
  <circle cx="90" cy="320" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="210" cy="410" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="580" cy="380" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Glowing Central Planet / Station -->
  <circle cx="400" cy="190" r="55" fill="#120738" stroke="url(#cyan-purple)" stroke-width="2.5"/>
  <path d="M 350 190 Q 400 220 450 190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="430" cy="170" r="6" fill="#38bdf8"/>

  <!-- Terminal Display Frame -->
  <rect x="180" y="270" width="440" height="90" rx="12" fill="#07021c" stroke="#7042f8" stroke-width="1.5"/>
  <text x="400" y="305" text-anchor="middle" fill="url(#cyan-purple)" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="3">WAR OF WEB</text>
  <text x="400" y="332" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="12" letter-spacing="1">INTERSTELLAR SPACE EXPLORATION HUB</text>

  <!-- Bottom Details Bar -->
  <rect x="160" y="390" width="480" height="42" rx="21" fill="#0d0628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="416" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">🚀 LIVE DEMO • INTERACTIVE CELESTIAL ENGINE</text>
  <text x="400" y="455" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Next.js • Galactic Telemetry • Responsive Sci-Fi Experience</text>
</svg>