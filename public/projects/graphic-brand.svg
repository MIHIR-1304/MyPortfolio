<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210526"/>
      <stop offset="50%" stop-color="#3d0a47"/>
      <stop offset="100%" stop-color="#140217"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Geometric Brand Icon Mark -->
  <g transform="translate(400, 180)">
    <!-- Outer Hexagon -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
    <!-- Inner overlapping triangles / modern mark -->
    <polygon points="0,-70 60,35 -60,35" fill="none" stroke="#f472b6" stroke-width="3"/>
    <polygon points="0,70 60,-35 -60,-35" fill="none" stroke="#a855f7" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="url(#logoGrad)"/>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(250, 310)">
    <circle cx="0" cy="0" r="14" fill="#f43f5e"/>
    <circle cx="50" cy="0" r="14" fill="#ec4899"/>
    <circle cx="100" cy="0" r="14" fill="#d946ef"/>
    <circle cx="150" cy="0" r="14" fill="#8b5cf6"/>
    <circle cx="200" cy="0" r="14" fill="#3b82f6"/>
    <circle cx="250" cy="0" r="14" fill="#06b6d4"/>
    <circle cx="300" cy="0" r="14" fill="#10b981"/>
  </g>

  <rect x="180" y="380" width="440" height="40" rx="20" fill="#3d0a47" stroke="#f472b6" stroke-width="1.5"/>
  <text x="400" y="405" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="16" font-weight="bold">🎨 FUTURISTIC SPACE &amp; BRAND IDENTITY SUITE</text>
  <text x="400" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Photoshop • Canva • Vector Branding • Typography System</text>
</svg>
