    <text y="95" fill="#c084fc">&gt;&gt; Armstrong &amp; Palindrome Check: Passed</text>
    <text y="115" fill="#f43f5e">&gt;&gt; Execution Benchmark: 0.42 ms (O(sqrt(N)) Optimized)</text>
  </g>

  <!-- Title Badge Frame -->
  <rect x="200" y="310" width="400" height="60" rx="12" fill="#200d04" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="338" text-anchor="middle" fill="url(#amber-orange)" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="2">NUMBER INTELLIGENCE ENGINE</text>
  <text x="400" y="358" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="11">MENU-DRIVEN CORE JAVA COMPUTATION ARCHITECTURE</text>

  <!-- Bottom Details Bar -->
  <rect x="160" y="395" width="480" height="42" rx="21" fill="#301305" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="421" text-anchor="middle" fill="#fcd34d" font-family="sans-serif" font-size="14" font-weight="bold">☕ CORE JAVA • ALGORITHMIC ANALYSIS &amp; OOP</text>
  <text x="400" y="460" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Mathematical Sequences • Modular OOP • Console Intelligence</text>
