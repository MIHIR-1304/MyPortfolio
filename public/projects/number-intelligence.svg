    <text y="35" fill="#6ee7b7">&gt;&gt; [STATUS] Prime Number Verified (10,000th Prime)</text>
    <text y="55" fill="#93c5fd">&gt;&gt; Binary: 11001100100011001 | Octal: 314431</text>
