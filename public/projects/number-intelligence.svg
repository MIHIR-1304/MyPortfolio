  </defs>

  <rect width="800" height="500" fill="url(#ni-bg)"/>

  <!-- Java Console Terminal Graphic -->
  <rect x="180" y="80" width="440" height="210" rx="14" fill="#0f0502" stroke="#f59e0b" stroke-width="2"/>
  <rect x="180" y="80" width="440" height="34" rx="14" fill="#301405"/>
  <circle cx="205" cy="97" r="5" fill="#ef4444"/>
  <circle cx="222" cy="97" r="5" fill="#f59e0b"/>
  <circle cx="239" cy="97" r="5" fill="#10b981"/>
  <text x="400" y="102" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="12" font-weight="bold">NumberEngine.java [JDK 21 - OOP Architecture]</text>

